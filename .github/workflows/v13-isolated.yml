name: Verificar MZT Conecta
on:
  push:
    branches: [main, v1.3-ajustes, v1.3.1]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: mzt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mzt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Pruebas JavaScript
        working-directory: MZT_Conecta_web_oficial
        run: |
          node --version
          find src -name '*.js' -print0 | xargs -0 -n 1 node --experimental-default-type=module --check
          node --experimental-default-type=module tests/v20.test.mjs
          node --experimental-default-type=module tests/v21.test.mjs
          node --experimental-default-type=module tests/v22.test.mjs
          node --experimental-default-type=module tests/v221.test.mjs
          node --experimental-default-type=module tests/v222.test.mjs
          node --experimental-default-type=module tests/v222-drafts.test.mjs
          node --experimental-default-type=module tests/v23.test.mjs
          node --experimental-default-type=module tests/v24.test.mjs
          node --experimental-default-type=module tests/v241.test.mjs
          node --experimental-default-type=module tests/v242.test.mjs
          node --experimental-default-type=module tests/v243.test.mjs
          node --experimental-default-type=module tests/v23-turnstile.test.mjs
          node --experimental-default-type=module tests/v12.test.mjs
          node --experimental-default-type=module tests/v13.test.mjs
          node --experimental-default-type=module tests/v131.test.mjs
      - name: Migración y permisos en base desechable
        env:
          PGPASSWORD: local_test_only
        run: |
          psql -h localhost -U postgres -d mzt_test -v ON_ERROR_STOP=1 -f MZT_Conecta_web_oficial/tests/v13-isolated.sql
          psql -h localhost -U postgres -d mzt_test -v ON_ERROR_STOP=1 -f MZT_Conecta_web_oficial/tests/v131-isolated.sql

          psql -h localhost -U postgres -d mzt_test -v ON_ERROR_STOP=1 -f MZT_Conecta_web_oficial/tests/v20-isolated.sql

          psql -h localhost -U postgres -d mzt_test -v ON_ERROR_STOP=1 -f MZT_Conecta_web_oficial/tests/v21-isolated.sql

          psql -h localhost -U postgres -d mzt_test -v ON_ERROR_STOP=1 -f MZT_Conecta_web_oficial/tests/v22-isolated.sql

          psql -h localhost -U postgres -d mzt_test -v ON_ERROR_STOP=1 -f MZT_Conecta_web_oficial/tests/v23-isolated.sql

          psql -h localhost -U postgres -d mzt_test -v ON_ERROR_STOP=1 -f MZT_Conecta_web_oficial/tests/v24-isolated.sql
          psql -h localhost -U postgres -d mzt_test -v ON_ERROR_STOP=1 -f MZT_Conecta_web_oficial/tests/v24-email-isolated.sql
          psql -h localhost -U postgres -d mzt_test -v ON_ERROR_STOP=1 -f MZT_Conecta_web_oficial/tests/v241-isolated.sql
          psql -h localhost -U postgres -d mzt_test -v ON_ERROR_STOP=1 -f MZT_Conecta_web_oficial/tests/v242-isolated.sql
      - name: Mapas en Chromium (sin servicios de producción)
        working-directory: MZT_Conecta_web_oficial
        run: |
          export MZT_BROWSER_DEPS="$RUNNER_TEMP/mzt-browser"
          export MZT_CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          test -n "$MZT_CHROME_PATH"
          npm install --prefix "$MZT_BROWSER_DEPS" --no-package-lock --no-save leaflet@1.9.4 playwright-core@1.56.1
          node tests/v24-browser.mjs
